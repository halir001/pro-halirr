<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>khadir hamza</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <img src="" alt="halir" class="profile-pic">

        <h1>Hi, I'm Khadija</h1>
        <p>Frontend Developer & IT Instructor</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#about">About</a>
        <a href="#hobbies">Hobbies</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Main Content -->
    <main>

        <section class="top-section">

            <!-- About -->
            <div class="card" id="about">
                <h2>About Me</h2>
                <p>
                    I'm learning web development because I want to
                    build things for the internet.
                </p>
            </div>

            <!-- Hobbies -->
            <div class="card" id="hobbies">
                <h2>Things I Enjoy</h2>

                <div class="hobbies">
                    <span>Reading</span>
                    <span>Music</span>
                    <span>Coding (soon!)</span>
                </div>
            </div>

        </section>

        <!-- Contact -->
        <section class="card contact" id="contact">
            <h2>Get In Touch</h2>

            <form>
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Your name"
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                >

                <label for="message">Message</label>
                <textarea
                    id="message"
                    placeholder="Say hello..."
                ></textarea>

                <button type="submit">Send</button>
            </form>
        </section>

    </main>

</body>
</html>
