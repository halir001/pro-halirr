<body>

            <div class="school-logo">🎓</div>

        <div class="school-content">

                </div>

                <div>
                    <h2>any age</h2>
                    <p>Teachers</p>

                <div>

            <button>

            <button>
                <a href="index.html"><--Back to home</a>
