<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Application</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    

    <div class="application-card">

        <h1>Center For Human Capacity Development</h1>
        <p class="subtitle">Student Application Form</p>

        <form>
<button><a href="nextpage.html" class="botton">Next Page </a></button>
            <h2>Personal Information</h2>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your full name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number">

            <label>Date of Birth</label>
            <input type="date">

            <h2>School Information</h2>

            <label>Choose Class</label>
            <select>
                <option>Select your class</option>
                <option>Data science</option>
                <option>cyber security</option>
                <option>software development</option>
                <option>3d making</option>
                <option>web development</option>
                <option>Ai</option>
            </select>

            <label>Choose department</label>
            <select>
                <option>Select department</option>
                <option>Science</option>
                <option>Arts</option>
                <option>Commercial</option>
            </select>

            <label>Address</label>
            <textarea placeholder="Enter your home address"></textarea>

            <button type="submit">Submit Application</button>
<button><a href="nextpage.html" class="botton">Next Page </a></button>

        </form>

    </div>
 
</body>
</html>
